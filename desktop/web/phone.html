<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cube Robot – phone</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .ph { display: flex; flex-direction: column; height: 100%; }
  .ph .viewer { flex: 1; min-height: 0; }
  .ph .bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .ph .ctrl { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px; }
  .ph .btn-grid { grid-template-columns: repeat(4, 1fr); margin-top: 8px; }
  .ph .btn-grid button { padding: 12px 4px; }
  .ph .track { max-height: 74px; overflow: auto; margin-top: 4px; }
  .ph .mv { min-width: 32px; padding: 4px 6px; font-size: 13px; }
</style>
</head>
<body>
<div class="ph">
  <div class="bar">
    <b>Cube Robot</b>
    <span class="big IDLE" id="rs" style="font-size:15px">…</span>
    <button class="danger" id="abort" style="padding:6px 12px">Abort</button>
  </div>
  <div class="viewer"><canvas id="cube3d"></canvas>
    <div class="scan-banner hidden" id="banner"></div></div>
  <div class="ctrl">
    <div class="solinfo" id="info">No solution yet</div>
    <div class="track" id="track"></div>
    <div class="speed">
      <div class="speed-head"><label>Speed</label><b id="sv"></b></div>
      <input type="range" id="speed" min="120" max="500" step="10">
      <div class="speed-scale"><span>500 ms</span><span>120 ms</span></div>
    </div>
    <div class="btn-grid">
      <button id="open">Open</button>
      <button id="close">Close</button>
      <button id="scramble">Scramble</button>
      <button id="solve" class="accent">Solve</button>
    </div>
    <div class="btn-grid" style="grid-template-columns:1fr 1fr">
      <button id="scan" class="primary">Scan</button>
      <button id="calc">Calculate</button>
    </div>
  </div>
</div>
<script src="cube3d.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const NAMES = { W: "white", Y: "yellow", R: "red", O: "orange", B: "blue", G: "green" };
  const view = new Cube3D.CubeView($("cube3d"));
  let S = null, runMap = null, running = false;
  const post = (p, b = {}) => fetch(p, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(b) }).then((r) => r.json()).then((j) => { if (j.ok === false) alert(j.error); return j; });

  function track(cur) {
    const t = $("track"); t.innerHTML = "";
    if (!S.solution) { $("info").textContent = S.solution_info && S.solution_info.done ? "Solved ✓" : "No solution yet"; return; }
    S.solution.forEach((m, i) => {
      const d = document.createElement("span");
      d.className = "mv" + (cur != null && i < cur ? " done" : "") + (i === cur ? " cur" : "");
      d.textContent = m; t.appendChild(d);
    });
    const inf = S.solution_info;
    $("info").textContent = `${inf.moves} moves · ≈${(inf.est_ms / 1000).toFixed(1)} s`;
  }
  function onState(st) {
    const prev = S && S.colors;
    if (!S && st.pose === "INVERT") view.setPose(["z'"], 1);
    S = st;
    const r = st.robot, state = r.connected ? r.state : "OFFLINE";
    $("rs").textContent = st.busy_task ? `${state} · ${st.busy_task}` : state;
    $("rs").className = "big " + state;
    const idle = r.connected && r.state === "IDLE" && !st.busy_task;
    ["open", "close", "scramble"].forEach((id) => ($(id).disabled = !idle));
    $("solve").disabled = !idle || !st.solution;
    $("scan").disabled = !!st.busy_task;
    $("calc").disabled = !st.solver_ready || !!st.busy_task;
    if (document.activeElement !== $("speed")) $("speed").value = st.settings.delay;
    $("sv").textContent = st.settings.delay + " ms";
    if (!running) { if (st.colors !== prev) view.setColors(st.colors); track(null); }
    const sc = st.scan;
    if (sc && !sc.done) {
      $("banner").classList.remove("hidden");
      $("banner").textContent = `Scanning ${NAMES[sc.color]} ${sc.index + 1}/${sc.total}`;
      view.highlight = sc.cells;
      if (sc.view && JSON.stringify(sc.view) !== view._sv) { view._sv = JSON.stringify(sc.view); view.setPose(sc.view, 450); }
    } else {
      $("banner").classList.add("hidden"); view.highlight = null;
      if (view._sv) { view._sv = null; view.setPose([], 450); }
    }
  }
  const es = new EventSource("/api/events");
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "state") onState(ev);
    else if (ev.type === "run") {
      running = true; runMap = [];
      ev.moves.forEach((mv, i) => { runMap.push(i); if (mv.endsWith("2")) runMap.push(i); });
    } else if (ev.type === "move") {
      view.turn(ev.move, Math.max(120, ev.dur)); S.colors = ev.colors;
      if (runMap && S.solution) track(runMap[ev.index]);
    } else if (ev.type === "pose") view.setPose(ev.pose === "INVERT" ? ["z'"] : [], ev.dur * 1.2);
    else if (ev.type === "run_done") { running = false; runMap = null; view.setColors(S.colors); }
  };
  $("open").onclick = () => post("/api/robot/open");
  $("close").onclick = () => post("/api/robot/close");
  $("scramble").onclick = () => post("/api/scramble", { n: 22 });
  $("solve").onclick = () => post("/api/execute");
  $("abort").onclick = () => post("/api/robot/abort");
  $("calc").onclick = () => post("/api/solve");
  $("scan").onclick = () => post("/api/scan/start");
  $("speed").onchange = (e) => post("/api/settings", { delay: +e.target.value });
  $("speed").oninput = (e) => ($("sv").textContent = e.target.value + " ms");
})();
</script>
</body>
</html>
