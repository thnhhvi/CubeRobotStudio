name: Build exe + apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build CubeRobotStudio.exe (Go, cross-compiled for Windows)
        working-directory: desktop-go
        run: |
          rm -rf web && cp -r ../desktop/web web
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o CubeRobotStudio.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: CubeRobotStudio-exe
          path: desktop-go/CubeRobotStudio.exe

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Solver / scan-mapping / simulated-robot tests
        working-directory: desktop
        run: |
          python -m pip install numpy pyserial pytest
          python -m pytest -q tests

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CubeRobotScanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CubeRobotScanner-apk
          path: android/CubeRobotScanner.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/CubeRobotStudio-exe/CubeRobotStudio.exe
            out/CubeRobotScanner-apk/CubeRobotScanner.apk
