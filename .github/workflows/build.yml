name: Build exe + apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build CubeRobotStudio.exe (Go, native WebView2 window, cross-compiled for Windows)
        working-directory: desktop-go
        run: |
          rm -rf web && cp -r ../desktop/web web
          go get github.com/jchv/go-webview2@latest
          go mod tidy
          go install github.com/tc-hib/go-winres@latest
          "$(go env GOPATH)/bin/go-winres" make --arch amd64
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o CubeRobotStudio.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: CubeRobotStudio-exe
          path: desktop-go/CubeRobotStudio.exe

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Solver / scan-mapping tests (Python prototype)
        working-directory: desktop
        run: |
          python -m pip install numpy pyserial pytest
          python -m pytest -q tests
      - name: App flow with race detector (scan, retake, confirm, solve, abort, close)
        working-directory: desktop-go
        run: |
          rm -rf web && cp -r ../desktop/web web
          go test -race -count=1 ./...
      - name: Physical simulation of the robot commands (solve + scan)
        working-directory: desktop-go
        run: |
          DUMP_SEQ=/tmp/seqs.json DUMP_PLAN=/tmp/plan.json go test -count=1 -run 'TestDump' .
          python ../tools/check_robot_commands.py solve /tmp/seqs.json
          python ../tools/check_robot_commands.py scan /tmp/plan.json
      - name: Firmware host tests (glide, and every app command replayed through the firmware)
        run: |
          g++ -std=gnu++17 -I tools/firmware_host_test -I arduino/Arduino tools/firmware_host_test/glide_test.cpp \
            arduino/Arduino/MyServo.cpp arduino/Arduino/SequenceManager.cpp -o /tmp/glide
          /tmp/glide
          (cd desktop-go && rm -rf web && cp -r ../desktop/web web && DUMP_FW=/tmp/fw.txt go test -count=1 -run TestDumpFirmwareSeqs .)
          g++ -std=gnu++17 -I tools/firmware_host_test -I arduino/Arduino tools/firmware_host_test/replay_test.cpp \
            arduino/Arduino/MyServo.cpp arduino/Arduino/SequenceManager.cpp -o /tmp/replay
          /tmp/replay /tmp/fw.txt

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile the firmware for the Arduino Nano (and check its RAM use)
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo
          arduino-cli compile --fqbn arduino:avr:nano arduino/Arduino 2>&1 | tee /tmp/size.txt
          pct=$(grep -o 'Global variables use [0-9]* bytes ([0-9]*%' /tmp/size.txt | grep -o '[0-9]*%' | tr -d '%')
          echo "RAM used by globals: ${pct}%"
          test "$pct" -le 80

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: android
        run: |
          mkdir -p app/src/main/assets
          cp ../desktop/web/phone.html ../desktop/web/style.css ../desktop/web/cube3d.js ../desktop/web/icon.png app/src/main/assets/
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CubeRobotScanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CubeRobotScanner-apk
          path: android/CubeRobotScanner.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, android-apk, core-tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Firmware zip (open Arduino/Arduino.ino in the Arduino IDE)
        run: cd arduino && zip -r ../out/CubeRobotFirmware.zip Arduino
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/CubeRobotStudio-exe/CubeRobotStudio.exe
            out/CubeRobotScanner-apk/CubeRobotScanner.apk
            out/CubeRobotFirmware.zip
